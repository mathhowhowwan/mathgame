<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代數應用高手</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Kalam:wght@700&family=Zen+Maru+Gothic:wght@700&display=swap');

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Kalam', '微軟正黑體', sans-serif;
            color: #eee;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        /* 黑板風格 */
        .blackboard {
            background-color: #263e2e;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0.3) 100%),
                url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
            border: 12px solid #5d4037;
            border-radius: 8px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            padding: 30px;
            position: relative;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            position: absolute;
            top: 20px;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 1.5em;
            color: #ffeb3b;
            letter-spacing: 1px;
        }

        .question-area {
            margin-top: 60px;
            text-align: center;
            width: 90%;
        }

        .level-tag {
            font-size: 1rem;
            color: #a5d6a7;
            border: 1px dashed #a5d6a7;
            padding: 2px 10px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 10px;
        }

        /* 題目文字顯示區 */
        .question-text {
            font-size: 1.8em;
            margin: 15px 0;
            font-family: 'Zen Maru Gothic', '微軟正黑體', sans-serif;
            font-weight: bold;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            min-height: 100px;
            letter-spacing: 1px;
            line-height: 1.6;
            color: #fff;
            text-align: left;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 10px;
        }
        
        .highlight {
            color: #ffcc80;
            margin: 0 3px;
            border-bottom: 2px dashed rgba(255, 204, 128, 0.5);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
        }

        .option-btn {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 15px;
            font-size: 1.5em;
            color: white;
            cursor: pointer;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-weight: bold;
            transition: transform 0.1s, background 0.2s;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70px;
        }

        .option-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.02);
            border-color: #ffeb3b;
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn.correct {
            background: rgba(76, 175, 80, 0.3);
            border-color: #4caf50;
            color: #a5d6a7;
        }

        .option-btn.wrong {
            background: rgba(244, 67, 54, 0.3);
            border-color: #f44336;
            color: #ef9a9a;
            opacity: 0.7;
        }

        .feedback-area {
            margin-top: 20px;
            height: 60px;
            text-align: center;
            font-size: 1.3em;
            color: #ffeb3b;
            font-family: 'Zen Maru Gothic', sans-serif;
            width: 100%;
        }

        .next-btn, .restart-btn {
            background-color: #ffeb3b;
            color: #3e2723;
            border: none;
            padding: 10px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            box-shadow: 0 4px 0 #fbc02d;
            margin-top: 5px;
            font-family: 'Zen Maru Gothic', sans-serif;
            text-decoration: none; /* 移除連結下底線 */
        }
        
        .next-btn:active, .restart-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* 遊戲結束畫面 */
        .game-over-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            background: rgba(38, 62, 46, 0.98);
            border-radius: 6px;
        }

        .final-score {
            font-size: 4em;
            color: #ffeb3b;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
        }

        .chalk-tray {
            position: absolute;
            bottom: -12px;
            width: 50%;
            height: 12px;
            background: #4e342e;
            border-radius: 0 0 4px 4px;
        }
        
        @media (max-width: 600px) {
            .question-text { font-size: 1.4em; }
            .option-btn { font-size: 1.2em; }
            .options-grid { grid-template-columns: 1fr; gap: 10px; }
            .blackboard { padding: 15px; }
            .header-info { font-size: 1.2em; padding: 0 10px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="blackboard">
        <div class="header-info">
            <div>題數: <span id="q-progress">1 / 10</span></div>
            <div>得分: <span id="score">0</span></div>
            <a href="https://mathhowhowwan.github.io/mathgame/" style="font-size:.72rem;color:#a5d6a7;text-decoration:none;opacity:.7;">🏠 回遊戲主頁</a>
        </div>
        
        <div id="game-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="question-area">
                <div id="level-indicator" class="level-tag">Level 1</div>
                <div id="question-text" class="question-text">
                    題目載入中...
                </div>
            </div>

            <div id="options-container" class="options-grid">
                <!-- 選項按鈕 -->
            </div>
        </div>

        <!-- 遊戲結束畫面 -->
        <div id="game-over-screen" class="game-over-screen">
            <h2 style="color: #a5d6a7; font-size: 2em; margin-bottom: 0;">任務完成！</h2>
            <div class="final-score" id="final-score-display">100</div>
            <div style="font-size: 1.5em; color: #fff; margin-bottom: 20px;">太棒了！</div>
            <button class="restart-btn" style="display: inline-block;" onclick="restartGame()">再玩一次 ↻</button>
            <br>
            <!-- 修改處：使用 a 標籤替代 button onclick 跳轉，更加穩定 -->
            <a href="https://mathhowhowwan.github.io/mathgame/" class="restart-btn" style="display: inline-flex; justify-content: center; align-items: center; margin-top: 15px; background-color: #a5d6a7; color: #3e2723;">🏠 回遊戲主頁</a>
        </div>

        <div class="feedback-area">
            <div id="feedback-text"></div>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">下一題 ➜</button>
        </div>

        <div class="chalk-tray"></div>
    </div>
</div>

<script>
    let currentScore = 0;
    let currentQuestion = null;
    let isAnswering = true;
    const TOTAL_QUESTIONS = 10;
    let questionCount = 0;

    function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // 產生題庫
    const generators = [
        // Level 1: 買東西算總價 (類似 3巧 + 2運)
        {
            level: "Level 1: 購物總價",
            gen: () => {
                const items = [
                    { name: "巧克力", price: "x" },
                    { name: "原子筆", price: "y" },
                    { name: "筆記本", price: "a" },
                    { name: "奶茶", price: "x" }
                ];
                const fixedItems = [
                    { name: "運動飲料", price: 25 },
                    { name: "橡皮擦", price: 10 },
                    { name: "科學麵", price: 8 },
                    { name: "洋芋片", price: 30 }
                ];

                const item1 = items[rand(0, items.length - 1)];
                const item2 = fixedItems[rand(0, fixedItems.length - 1)];
                
                const num1 = rand(2, 5); // 變數物品的數量
                const num2 = rand(2, 4); // 固定價格物品的數量
                const totalFixed = num2 * item2.price;

                const qText = `弘宇去超商買了 <span class="highlight">${num1}</span> 個${item1.name} (每個 <span class="highlight">${item1.price}</span> 元)，<br>還有 <span class="highlight">${num2}</span> 個${item2.name} (每個 <span class="highlight">${item2.price}</span> 元)。<br>請問他總共要付多少錢？`;
                
                const ans = `${num1}${item1.price} + ${totalFixed}`;
                
                const wrongs = [
                    `${num1}${item1.price} + ${num2}`, // 忘記乘單價
                    `${num1} + ${num2}${item1.price}`, // 數字亂湊
                    `${num1 + num2}${item1.price}`,    // 數量全加在一起
                    `${item1.price} + ${totalFixed}`   // 只有一個x
                ];

                return {
                    q: qText,
                    a: ans,
                    wrongs: wrongs,
                    hint: `總花費 = (${item1.name}數量 × 單價) + (${item2.name}數量 × 單價)`
                };
            }
        },
        // Level 2: 找錢問題 (付錢 - 花費)
        {
            level: "Level 2: 找錢問題",
            gen: () => {
                const totalMoney = [100, 200, 500, 1000][rand(0, 3)];
                const itemNames = ["漢堡", "雞排", "便當", "蛋糕"];
                const item = itemNames[rand(0, itemNames.length - 1)];
                const num = rand(2, 6);
                const variable = ["x", "y"][rand(0, 1)];

                const qText = `小明帶了 <span class="highlight">${totalMoney}</span> 元，買了 <span class="highlight">${num}</span> 個${item}，<br>如果每個${item}賣 <span class="highlight">${variable}</span> 元，<br>請問他還剩下多少錢？`;
                
                const ans = `${totalMoney} - ${num}${variable}`;
                
                const wrongs = [
                    `${num}${variable} - ${totalMoney}`, // 減反了
                    `${totalMoney} - ${variable}`,       // 忘記乘數量
                    `${totalMoney} + ${num}${variable}`, // 變成加法
                    `${num}${variable} + ${totalMoney}`
                ];

                return {
                    q: qText,
                    a: ans,
                    wrongs: wrongs,
                    hint: "剩下的錢 = 帶去的錢 - 買東西花的總錢數"
                };
            }
        },
        // Level 3: 分配問題 (散裝 + 盒裝)
        {
            level: "Level 3: 數量計算",
            gen: () => {
                const container = ["箱", "袋", "盒"][rand(0, 2)];
                const item = ["橘子", "糖果", "餅乾"][rand(0, 2)];
                const boxCount = rand(3, 8);
                const looseCount = rand(1, 9);
                const v = "x";

                const qText = `桌上有 <span class="highlight">${boxCount}</span> ${container}${item}，每${container}有 <span class="highlight">${v}</span> 個，<br>另外還有 <span class="highlight">${looseCount}</span> 個散的。<br>請問總共有幾個${item}？`;
                
                const ans = `${boxCount}${v} + ${looseCount}`;
                
                const wrongs = [
                    `${boxCount}${v} - ${looseCount}`,
                    `${boxCount} + ${v} + ${looseCount}`,
                    `${looseCount}${v} + ${boxCount}`,
                    `${boxCount}(${v} + ${looseCount})`
                ];

                return {
                    q: qText,
                    a: ans,
                    wrongs: wrongs,
                    hint: "總數量 = (幾箱 × 每箱個數) + 散的個數"
                };
            }
        }
    ];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function restartGame() {
        currentScore = 0;
        questionCount = 0;
        document.getElementById('score').innerText = 0;
        document.getElementById('game-over-screen').style.display = 'none';
        nextQuestion();
    }

    function showGameOver() {
        document.getElementById('game-over-screen').style.display = 'flex';
        document.getElementById('final-score-display').innerText = currentScore;
    }

    function nextQuestion() {
        if (questionCount >= TOTAL_QUESTIONS) {
            showGameOver();
            return;
        }

        questionCount++;
        document.getElementById('q-progress').innerText = `${questionCount} / ${TOTAL_QUESTIONS}`;
        document.getElementById('feedback-text').innerText = "";
        document.getElementById('next-btn').style.display = "none";
        document.getElementById('options-container').innerHTML = "";
        isAnswering = true;

        const genObj = generators[rand(0, generators.length - 1)];
        document.getElementById('level-indicator').innerText = genObj.level;
        
        const qData = genObj.gen();
        currentQuestion = qData;
        
        document.getElementById('question-text').innerHTML = qData.q;

        let options = [];
        options.push({ text: qData.a, isCorrect: true });
        
        let wrongs = shuffle(qData.wrongs).slice(0, 3);
        wrongs.forEach(w => options.push({ text: w, isCorrect: false }));
        
        options = shuffle(options);

        const container = document.getElementById('options-container');
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt.text;
            btn.onclick = () => checkAnswer(btn, opt.isCorrect);
            container.appendChild(btn);
        });
    }

    function checkAnswer(btn, isCorrect) {
        if (!isAnswering) return;
        isAnswering = false;

        const allBtns = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedback-text');

        if (isCorrect) {
            btn.classList.add('correct');
            feedback.innerHTML = "🎉 正確！完全符合題意！";
            currentScore += 10;
            document.getElementById('score').innerText = currentScore;
        } else {
            btn.classList.add('wrong');
            feedback.innerHTML = `💡 提示：${currentQuestion.hint}`;
            feedback.style.color = "#ff8a80";
            
            allBtns.forEach(b => {
                if (b.innerHTML === currentQuestion.a) {
                    b.classList.add('correct');
                }
            });
        }
        
        const nextBtn = document.getElementById('next-btn');
        if (questionCount >= TOTAL_QUESTIONS) {
            nextBtn.innerText = "看成績 🏆";
        } else {
            nextBtn.innerText = "下一題 ➜";
        }
        nextBtn.style.display = "inline-block";
    }

    nextQuestion();

</script>

</body>
</html>
